name: CI/CD
# Workflow nun vorhanden, startet bei push und pull_request
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Einrichten der Py-Version und Dependencies und Tests
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GH speichert die downgeloadeten Py-Pakete, Cache wird wiederverwendet, wenn requirements.txt nicht geändert wurde
      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
    
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

        # Erzeuge build-Ordner, zippe src-Dateien in Artifact für nächsten Job
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

        # Upload von Artifact
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
            name: app-paket
            path: build/

  # Hinzufügen von Deploy-Job -> Artifact soll im zweiten Job genutzt werden
  deploy:
    needs: test
    # Deployment läuft nicht bei Pull Requests
    if: github.ref == 'refs/heads/main'
    # GitHub verlangt meine Freigabe
    environment: production
    runs-on: ubuntu-latest

    # Minimal aber gerade noch ausreichend
    permissions:
        contents: write
        actions: read

    steps:
      - name: Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/
         
      - name: Zugangsdaten prüfen
        env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
            echo "Token-Länge: ${#DEPLOY_TOKEN}"

    # Pipeline wird Release erstellen mit unique version ID
    # das Zip-Artifact wird als Release-Asset angehängt
    # Permissions für Write schon weiter oben unter deploy erstellt
      - name: Release erstellen
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automatisches Release aus CI/CD Pipeline"
          files: build/app.zip
